{% extends "base.html" %}
{% block title %}Login{% endblock title %}
{% block main %}
<form id="loginForm" class="shadow p-5 m-5">
  {% csrf_token %}
  <h1 class="text-center">Login</h1>
  <div>
    <label for="email">
      Email:
    </label>
    <input type="email" name="email" id="email" class="form-control">
  </div>

  <div>
    <label for="password">
      Password :
    </label>
    <input type="password" name="password" id="password" class="form-control">
  </div>
  <div class="d-flex justify-content-between">
  <button class="btn btn-primary mt-3 loginBtn">Login</button>
  <a href="/password_reset/" class="mt-3">Forgot Password?</a>
  </div>
  <div id="msg" class="mt-3"></div>
</form>

{% endblock main %}
