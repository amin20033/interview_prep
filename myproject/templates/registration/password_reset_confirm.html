{% extends "base.html" %}
{% block title %}Reset Password Confirm{% endblock title %}
{% block main %}
<div class="shadow p-3 mt-5">
<h2 class="text-center mb-3">Set New Password</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Reset Password</button>
</form>
</div>
{% endblock %}
