<!doctype html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock title %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'css/style.css'%}" />
  </head>
  <body>
    <nav class="navbar navbar-expand-sm mynavbar">
      <div class="container-fluid">
        <!-- Logo -->
        <a class="navbar-brand" href="/">
          <img src="{% static 'images/logo.png' %}" alt="logo" height="80" />
        </a>

        <!-- Navbar Links -->
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link text-white" href="/home/">Home</a>
          </li>

          {% if user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link text-white" href="/history/">History</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" href="/logout/">Logout</a>
          </li>
          {% else %}
          <li class="nav-item">
            <a class="nav-link text-white" href="/signup/">Signup</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" href="/">Login</a>
          </li>
          {% endif %}
        </ul>
        {% if user.is_authenticated %}
        <p class="ms-auto">Hello {{user.name}}!</p>
        {% endif %}
      </div>
    </nav>
    <div class="container">{% block main %} {% endblock main %}</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="{% static 'js/index.js'%}"></script>
  </body>
</html>
